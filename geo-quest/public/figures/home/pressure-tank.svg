<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>A well pressure tank, nearly empty and full</title><style>.lbl{fill:#333}.sm{font-size:12px;fill:#555}.lead{stroke:#888;stroke-width:1;fill:none}.t{font-size:17px;font-weight:600;fill:#444}</style>
  <rect width="720" height="420" rx="14" fill="#fbfaf6"/>
  <text x="24" y="36" class="t">A bladder pressure tank</text>
  <g transform="translate(110,60)">
    <rect x="0" y="20" width="160" height="270" rx="60" fill="#e4e7ea" stroke="#8a9bab" stroke-width="3"/>
    <path d="M6 240 Q80 290 154 240 L154 250 Q80 300 6 250 Z" fill="#7fc0e6"/>
    <path d="M6 238 Q80 290 154 238" fill="none" stroke="#3d7fd1" stroke-width="2"/>
    <rect x="74" y="4" width="12" height="18" fill="#8a8578"/>
    <path d="M80 290 V320 H200" stroke="#b07a4a" stroke-width="10" fill="none"/>
    <text x="40" y="140" class="lbl">air</text>
    <text x="-20" y="345" class="lbl">Nearly empty: the pump</text><text x="-20" y="363" class="lbl">is about to switch on</text>
  </g>
  <g transform="translate(450,60)">
    <rect x="0" y="20" width="160" height="270" rx="60" fill="#e4e7ea" stroke="#8a9bab" stroke-width="3"/>
    <path d="M6 110 Q80 60 154 110 L154 240 Q80 300 6 240 Z" fill="#7fc0e6" stroke="#3d7fd1" stroke-width="2"/>
    <rect x="74" y="4" width="12" height="18" fill="#8a8578"/>
    <path d="M80 290 V320 H-60" stroke="#b07a4a" stroke-width="10" fill="none"/>
    <text x="54" y="62" class="sm">air, squeezed</text>
    <text x="40" y="190" class="lbl">water in</text><text x="40" y="206" class="lbl">the bladder</text>
    <text x="-20" y="345" class="lbl">Full: the pump has</text><text x="-20" y="363" class="lbl">just switched off</text>
  </g>
  <text x="300" y="70" class="sm">air valve (like a tire's):</text><text x="300" y="86" class="sm">set about 2 psi below the</text><text x="300" y="102" class="sm">pump's turn-on pressure</text>
  <path class="lead" d="M296 76 L200 66"/>
</svg>
