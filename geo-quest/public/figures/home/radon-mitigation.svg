<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Sub-slab depressurization: a fan pulls radon from under the floor and vents it above the roof</title><style>.lbl{fill:#333}.sm{font-size:12px;fill:#555}.lead{stroke:#888;stroke-width:1;fill:none}.t{font-size:17px;font-weight:600;fill:#444}</style>
  <defs><pattern id="gr" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ece7dc"/><circle cx="3" cy="3" r="1.6" fill="#b9b1a2"/><circle cx="8" cy="7" r="1.3" fill="#c7bfb0"/></pattern></defs>
  <rect width="720" height="520" rx="14" fill="#fbfaf6"/>
  <text x="24" y="32" class="t">Venting radon from under the slab</text>
  <!-- ground -->
  <rect x="24" y="300" width="420" height="200" fill="#e3d2b6"/>
  <!-- house shell -->
  <path d="M60 140 L230 64 L400 140" fill="none" stroke="#9c8a78" stroke-width="8"/>
  <rect x="60" y="140" width="10" height="160" fill="#efe3cf"/><rect x="390" y="140" width="10" height="160" fill="#efe3cf"/>
  <rect x="60" y="140" width="340" height="8" fill="#e9d3b0"/>
  <rect x="60" y="292" width="340" height="12" fill="#e9d3b0"/>
  <!-- basement walls, gravel, slab -->
  <rect x="60" y="304" width="18" height="150" fill="#d6d6d2"/><rect x="382" y="304" width="18" height="150" fill="#d6d6d2"/>
  <rect x="78" y="440" width="304" height="30" fill="url(#gr)"/>
  <rect x="78" y="428" width="304" height="12" fill="#cfcfca"/>
  <rect x="50" y="454" width="40" height="18" fill="#cacac5"/><rect x="370" y="454" width="40" height="18" fill="#cacac5"/>
  <!-- sealed crack -->
  <path d="M150 428 l4 6 l-3 6" stroke="#d46a5b" stroke-width="3" fill="none"/>
  <!-- suction pit -->
  <path d="M286 440 q22 30 44 0 Z" fill="#f3ede3"/>
  <!-- radon arrows rising into the gravel and pit -->
  <g stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-dasharray="4 3"><path d="M160 498 Q200 470 286 458"/><path d="M250 498 Q280 480 300 460"/><path d="M380 498 Q350 478 322 460"/></g>
  <!-- vent pipe -->
  <path d="M308 446 V40" stroke="#9fb4c8" stroke-width="12"/>
  <!-- fan in attic -->
  <rect x="290" y="104" width="36" height="34" rx="8" fill="#b8c6d3" stroke="#6f8496"/>
  <circle cx="308" cy="121" r="7" fill="none" stroke="#6f8496" stroke-width="2"/>
  <!-- manometer -->
  <path d="M292 320 v34 q0 8 -8 8 h0 q-8 0 -8 -8 v-34" fill="none" stroke="#6f8496" stroke-width="2.5"/>
  <path d="M276 340 v14 q0 8 8 8 q8 0 8 -8 v-24" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <path d="M292 330 H302" stroke="#6f8496" stroke-width="2"/>
  <!-- exhaust -->
  <g stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-dasharray="4 3"><path d="M300 34 q-10 -10 -4 -18"/><path d="M316 34 q10 -10 4 -18"/></g>
  <text x="160" y="380" class="sm">basement</text>
  <text x="140" y="222" class="sm">living space</text>
  <!-- labels -->
  <text x="470" y="44" class="lbl">exhaust above the roof</text><text x="470" y="60" class="sm">away from windows and doors</text>
  <path class="lead" d="M466 46 H322"/>
  <text x="470" y="118" class="lbl">fan</text><text x="470" y="134" class="sm">in the attic, garage or outside,</text><text x="470" y="150" class="sm">never in the living space</text>
  <path class="lead" d="M466 120 H328"/>
  <text x="470" y="328" class="lbl">U-tube gauge (manometer)</text><text x="470" y="344" class="sm">uneven liquid: the fan is pulling</text>
  <path class="lead" d="M466 332 L300 342"/>
  <text x="470" y="406" class="lbl">sealed cracks and joints</text><text x="470" y="422" class="sm">so the fan pulls from the soil,</text><text x="470" y="438" class="sm">not the room</text>
  <path class="lead" d="M466 410 L156 428"/>
  <text x="470" y="470" class="lbl">suction pit in the gravel</text><text x="470" y="486" class="sm">a few feet of soil gas around it</text><text x="470" y="502" class="sm">is pulled into the pipe</text>
  <path class="lead" d="M466 474 L332 452"/>
</svg>
