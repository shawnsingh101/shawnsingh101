<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>How a sink's pop-up drain works</title><style>.lbl{fill:#333}.sm{font-size:12px;fill:#555}.lead{stroke:#888;stroke-width:1;fill:none}.t{font-size:17px;font-weight:600;fill:#444}</style>
  <rect width="700" height="460" rx="14" fill="#fbfaf6"/>
  <text x="24" y="36" class="t">A sink's pop-up drain</text>
  <path d="M80 90 H420 V100 Q400 190 250 190 Q100 190 80 100 Z" fill="#fff" stroke="#9aa" stroke-width="2"/>
  <path d="M95 112 Q115 178 250 178 Q385 178 405 112 Z" fill="#cfe8f6"/>
  <!-- faucet + lift rod -->
  <path d="M440 90 V60 H380 v-10 h70 v40" fill="#d9d4c8" stroke="#8a8578"/>
  <rect x="446" y="20" width="6" height="200" fill="#8a8578"/>
  <!-- clevis strap with holes -->
  <rect x="456" y="190" width="10" height="110" fill="#b5aea0" stroke="#8a8578"/>
  <g fill="#fbfaf6"><circle cx="461" cy="210" r="3"/><circle cx="461" cy="230" r="3"/><circle cx="461" cy="250" r="3"/><circle cx="461" cy="270" r="3"/><circle cx="461" cy="290" r="3"/></g>
  <!-- tailpiece and stopper -->
  <rect x="234" y="190" width="32" height="200" fill="#e7ecef" stroke="#9aa"/>
  <path d="M228 182 h44 l-6 10 h-32 z" fill="#8a8578"/>
  <rect x="246" y="192" width="8" height="60" fill="#8a8578"/>
  <!-- pivot rod and ball -->
  <line x1="250" y1="250" x2="461" y2="250" stroke="#555" stroke-width="5"/>
  <circle cx="290" cy="250" r="10" fill="#c9c4bb" stroke="#8a8578"/>
  <rect x="300" y="236" width="18" height="28" fill="#c9c4bb" stroke="#8a8578"/>
  <!-- labels -->
  <text x="480" y="40" class="lbl">lift rod</text><text x="480" y="56" class="sm">pull up to close the drain</text><path class="lead" d="M476 36 H454"/>
  <text x="480" y="210" class="lbl">clevis</text><text x="480" y="226" class="sm">strap with holes; set the</text><text x="480" y="242" class="sm">stopper's height here</text><path class="lead" d="M476 206 H468"/>
  <text x="480" y="290" class="lbl">pivot rod</text><path class="lead" d="M476 286 L400 254"/>
  <text x="290" y="320" class="lbl">pivot ball and retaining nut</text><path class="lead" d="M310 306 L300 266"/>
  <text x="40" y="250" class="lbl">stopper</text><path class="lead" d="M100 246 H244"/>
  <text x="40" y="330" class="lbl">tailpiece</text><text x="40" y="346" class="sm">down to the trap</text><path class="lead" d="M110 326 H232"/>
  <text x="40" y="420" class="sm">Lifting the rod tips the pivot rod up at the back and pulls the stopper down; pushing it lifts the stopper.</text>
</svg>
