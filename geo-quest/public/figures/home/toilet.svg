<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Inside a toilet: the tank and the bowl</title><style>.lbl{fill:#333}.sm{font-size:12px;fill:#555}.lead{stroke:#888;stroke-width:1;fill:none}.t{font-size:17px;font-weight:600;fill:#444}</style>
  <rect width="760" height="520" rx="14" fill="#fbfaf6"/>
  <text x="24" y="36" class="t">Inside a toilet</text>
  <!-- tank -->
  <rect x="200" y="60" width="300" height="170" rx="8" fill="#fff" stroke="#9aa" stroke-width="2"/>
  <rect x="206" y="100" width="288" height="124" fill="#cfe8f6"/>
  <line x1="206" y1="100" x2="494" y2="100" stroke="#3d7fd1" stroke-dasharray="5 4"/>
  <!-- fill valve -->
  <rect x="236" y="90" width="18" height="140" fill="#d9d4c8" stroke="#8a8578"/>
  <rect x="226" y="140" width="38" height="30" rx="6" fill="#efe9da" stroke="#8a8578"/>
  <rect x="241" y="230" width="8" height="40" fill="#b07a4a"/>
  <!-- refill tube -->
  <path d="M254 98 Q300 70 372 84" fill="none" stroke="#555" stroke-width="3"/>
  <!-- overflow tube -->
  <rect x="368" y="80" width="14" height="140" fill="#d9d4c8" stroke="#8a8578"/>
  <!-- flapper and chain -->
  <path d="M390 214 Q420 196 450 214 Z" fill="#c4453a"/>
  <rect x="384" y="214" width="72" height="10" fill="#8a8578"/>
  <path d="M422 200 L430 92" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M430 92 L488 76" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <rect x="482" y="64" width="26" height="18" rx="4" fill="#ccc"/>
  <!-- bowl -->
  <path d="M190 260 H560 Q560 330 470 360 L440 440 H300 L300 360 Q190 330 190 260 Z" fill="#fff" stroke="#9aa" stroke-width="2"/>
  <path d="M215 268 Q240 330 330 330 Q330 300 345 292 Q400 285 540 268 Z" fill="#cfe8f6"/>
  <!-- trapway: up over the weir then down -->
  <path d="M335 330 Q360 380 400 330 Q420 300 440 340 L440 440" fill="none" stroke="#7fc0e6" stroke-width="16" stroke-linejoin="round"/>
  <path d="M420 230 V262" stroke="#7fc0e6" stroke-width="10"/>
  <!-- wax ring and flange -->
  <rect x="408" y="440" width="64" height="12" rx="5" fill="#e3c77a"/>
  <rect x="396" y="452" width="88" height="8" fill="#5b8fd1"/>
  <rect x="424" y="460" width="32" height="40" fill="#e7ecef" stroke="#9aa"/>
  <!-- labels left -->
  <text x="40" y="104" class="lbl">water line</text><path class="lead" d="M112 100 H204"/>
  <text x="40" y="160" class="lbl">fill valve</text><text x="40" y="176" class="sm">(ballcock)</text><path class="lead" d="M104 156 H224"/>
  <text x="40" y="214" class="lbl">float</text><path class="lead" d="M78 210 L226 160"/>
  <text x="40" y="262" class="lbl">supply line</text><path class="lead" d="M118 258 H240"/>
  <text x="40" y="310" class="lbl">rim holes</text><path class="lead" d="M108 306 L210 270"/>
  <text x="40" y="412" class="lbl">trapway</text><text x="40" y="428" class="sm">a trap built into</text><text x="40" y="444" class="sm">the base (S-shaped)</text><path class="lead" d="M100 408 L350 360"/>
  <text x="40" y="490" class="lbl">wax ring and closet flange</text><path class="lead" d="M220 486 L396 456"/>
  <!-- labels right -->
  <text x="560" y="64" class="lbl">flush handle</text><path class="lead" d="M556 60 H510"/>
  <text x="560" y="96" class="lbl">refill tube</text><text x="560" y="112" class="sm">tops up the bowl</text><path class="lead" d="M556 92 L340 80"/>
  <text x="560" y="140" class="lbl">overflow tube</text><path class="lead" d="M556 136 H384"/>
  <text x="560" y="172" class="lbl">lift chain</text><path class="lead" d="M556 168 L426 160"/>
  <text x="560" y="210" class="lbl">flapper</text><text x="560" y="226" class="sm">opens to flush,</text><text x="560" y="242" class="sm">seals the tank</text><path class="lead" d="M556 206 L452 208"/>
  <text x="580" y="330" class="lbl">jet hole</text><text x="580" y="346" class="sm">starts the siphon</text><path class="lead" d="M576 326 L470 318 L340 326"/><circle cx="336" cy="326" r="4" fill="#3d7fd1"/>
  <text x="520" y="480" class="lbl">to the drain</text>
</svg>
