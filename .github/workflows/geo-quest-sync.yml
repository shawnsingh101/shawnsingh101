name: GeoQuest data sync

# Every night, re-pull country facts from Wikidata. If anything changed
# (a capital moved, a country renamed, a new flag), commit the new snapshot;
# the app then shows what changed and re-queues the affected flashcards.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geo-quest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geo-quest/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Refresh the dashboard (markets, rates, inflation, World Bank)
        run: node scripts/sync-dashboard.mjs
        continue-on-error: true   # a flaky source shouldn't stop the facts from being saved
        timeout-minutes: 20
        env:
          EIA_KEY: ${{ secrets.EIA_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
      - name: Refresh collections (artworks; also writes Wikidata ids into new list entries)
        run: node scripts/sync-collections.mjs
        continue-on-error: true
        timeout-minutes: 10
      - name: Refresh presidents' portraits
        run: node scripts/sync-presidents.mjs
        continue-on-error: true
        timeout-minutes: 5
      - name: Commit if the world changed
        run: |
          if git diff --quiet -- public/data data/audio-cache.json collections; then echo "No changes."; exit 0; fi
          git config user.name "geoquest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/audio-cache.json collections   # the cache lets each night's pronunciation search pick up where the last stopped
          git commit -m "GeoQuest: refresh facts from Wikidata"
          git push
